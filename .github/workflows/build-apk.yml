name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RevisioniApp-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevisioniApp-debug-apk
          path: RevisioniApp-debug.apk

      - name: Create/Update release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Le Mie Scadenze (ultima build)
          body: APK generato automaticamente da GitHub Actions.
          files: RevisioniApp-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
