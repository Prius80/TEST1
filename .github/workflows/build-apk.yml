name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_output.log

      - name: Print error excerpt if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "----- LAST 200 LINES OF GRADLE OUTPUT -----"
          tail -n 200 gradle_output.log
          EXCERPT=$(tail -n 60 gradle_output.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::error::GRADLE BUILD FAILED. Tail of output:%0A$EXCERPT"
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RevisioniApp-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevisioniApp-debug-apk
          path: RevisioniApp-debug.apk

      - name: Upload gradle log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle_output.log

      - name: Create/Update release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Le Mie Scadenze (ultima build)
          body: APK generato automaticamente da GitHub Actions.
          files: RevisioniApp-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
