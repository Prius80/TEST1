name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace > gradle_output.log 2>&1

      - name: Report result
        if: always()
        run: |
          echo "===== LAST 150 LINES OF GRADLE OUTPUT ====="
          tail -n 150 gradle_output.log || true
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "===== COMPILER ERROR LINES (e:) ====="
            grep -n "^e: " gradle_output.log || true
            COMPILER_ERRORS=$(grep "^e: " gradle_output.log | head -n 40)
            if [ -z "$COMPILER_ERRORS" ]; then
              COMPILER_ERRORS=$(tail -n 80 gradle_output.log)
            fi
            EXCERPT=$(printf '%s\n' "$COMPILER_ERRORS" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::GRADLE BUILD FAILED.%0A$EXCERPT"
            exit 1
          fi
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::Build reported success but app-debug.apk was not found at the expected path."
            find app/build -name "*.apk" || true
            exit 1
          fi
          if [ ! -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::error::Build reported success but app-release-unsigned.apk was not found at the expected path."
            find app/build -name "*.apk" || true
            exit 1
          fi

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RevisioniApp-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk RevisioniApp-release-unsigned.apk

      - name: Package apksigner + zipalign (build-tools) for offline signing
        run: |
          set -e
          BT_DIR=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          echo "Using build-tools at: $BT_DIR"
          mkdir -p apksigner-tools
          cp "$BT_DIR/apksigner" apksigner-tools/ || true
          cp "$BT_DIR/lib/apksigner.jar" apksigner-tools/ || true
          cp "$BT_DIR/zipalign" apksigner-tools/ || true
          ls -la apksigner-tools
          tar -czf apksigner-tools.tar.gz apksigner-tools

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RevisioniApp-apks
          path: |
            RevisioniApp-debug.apk
            RevisioniApp-release-unsigned.apk
            apksigner-tools.tar.gz

      - name: Upload gradle log always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle_output.log

      - name: Create/Update release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Le Mie Scadenze (ultima build)
          body: >
            APK generati automaticamente da GitHub Actions.
            RevisioniApp-debug.apk è pronto da installare.
            RevisioniApp-release-unsigned.apk è la build di release NON firmata
            (va firmata prima di poter essere installata).
          files: |
            RevisioniApp-debug.apk
            RevisioniApp-release-unsigned.apk
            apksigner-tools.tar.gz
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
